<h1>Add Question to: {{ quiz.title }}</h1>

<form method="POST">
    {% csrf_token %}

    <label>Question Text:</label><br>
    <textarea name="question_text"></textarea><br><br>

    <label>Question Type:</label><br>
    <select name="question_type">
        <option value="MCQ">Multiple Choice</option>
        <option value="TF">True/False</option>
        <option value="SA">Short Answer</option>
    </select><br><br>

    <label>Points:</label><br>
    <input type="number" name="points"><br><br>

    <button type="submit">Add Question</button>
</form>

<hr>

<h2>Existing Questions</h2>

{% for q in questions %}
<div>
    <b>{{ q.question_text }}</b> ({{ q.question_type }}) - {{ q.points }} points<br>
    <a href="/quiz/instructor/questions/{{ q.question_id }}/answers/add/">Add Answers</a>
</div>
<hr>
{% endfor %}

<br>
<a href="/quiz/instructor/quizzes/">Back to Quizzes</a>
