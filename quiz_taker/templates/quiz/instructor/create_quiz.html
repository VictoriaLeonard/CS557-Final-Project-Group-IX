{% extends 'base.html' %}

{% block title %}Create Quiz{% endblock %}

{% block content %}
<div class="card">
    <h1>Create Quiz</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Title:</label><br>
        <input type="text" name="title" required><br><br>

        <label>Description:</label><br>
        <textarea name="description"></textarea><br><br>

        <label>Time Limit (minutes):</label><br>
        <input type="number" name="time_limit" required><br><br>

        <label>Passing Score (%):</label><br>
        <input type="number" name="passing_score"><br><br>

        <label>Start Date:</label><br>
        <input type="datetime-local" name="start_date" required><br><br>

        <label>End Date:</label><br>
        <input type="datetime-local" name="end_date" required><br><br>

        <button type="submit" class="btn btn-primary">Create</button>
    </form>

    <br>
    <a href="{% url 'instructor_quizzes' %}" class="btn btn-danger">Back</a>
</div>
{% endblock %}
