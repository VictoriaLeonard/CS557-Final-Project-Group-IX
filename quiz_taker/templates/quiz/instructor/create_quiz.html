{% extends 'base.html' %}

{% block title %}Quizzes{% endblock %}

{% block content %}
    <div class="card">
        <h1>Create Quiz</h1>
        <br>
        <form method="POST">
            {% csrf_token %}

            <label>Title:</label><br>
            <input type="text" name="title"><br><br>

            <label>Description:</label><br>
            <textarea name="description"></textarea><br><br>

            <label>Time Limit (minutes):</label><br>
            <input type="number" name="time_limit"><br><br>

            <label>Passing Score (%):</label><br>
            <input type="number" name="passing_score"><br><br>

            <label>Start Date:</label><br>
            <input type="datetime-local" name="start_date"><br><br>

            <label>End Date:</label><br>
            <input type="datetime-local" name="end_date"><br><br>

            <button type="submit" class="btn btn-primary">Create</button>
        </form>

        <br>
        <form method="post" action="{% url 'instructor_home' %}" style="display: inline;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Dashboard</button>
        </form>
    </div>
{% endblock %}
