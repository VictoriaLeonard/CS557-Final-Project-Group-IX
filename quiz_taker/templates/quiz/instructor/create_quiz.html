<h1>Create Quiz</h1>

<form method="POST">
    {% csrf_token %}

    <label>Title:</label><br>
    <input type="text" name="title"><br><br>

    <label>Description:</label><br>
    <textarea name="description"></textarea><br><br>

    <label>Time Limit (minutes):</label><br>
    <input type="number" name="time_limit"><br><br>

    <label>Passing Score (%):</label><br>
    <input type="number" name="passing_score"><br><br>

    <label>Start Date:</label><br>
    <input type="datetime-local" name="start_date"><br><br>

    <label>End Date:</label><br>
    <input type="datetime-local" name="end_date"><br><br>

    <button type="submit">Create</button>
</form>

<br>
